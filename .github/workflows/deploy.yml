# Ingest every release the data lacks, publish the data branch, and publish the API and the generated artefacts to
# Pages from the gh-pages branch, with the main hub's code (its deploy-run.yml). Labs leaves out the stores and the
# mods index. Only the Labs control plane starts it, on its slots (control's deploys.py).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      force:
        description: Comma-separated owner/repo@tag releases to ingest again even when held
        type: string
        default: ''

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: linuxserver-playground/hub/.github/workflows/deploy-run.yml@main
    with:
      generators: docs,proxy,kubernetes,quadlet,builds
      force: ${{ inputs.force }}
    secrets: inherit
